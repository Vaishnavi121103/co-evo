name: ember_pilot_v4
rounds: 8
convergence_window: 4
convergence_tol: 0.03
early_stop: false
seed: 0
output_dir: results
dataset:
  name: ember
  n_features: 32
  n_train: 8000
  n_test_malicious: 600
  class_separation: 1.4
  mutable_fraction: 0.5
  ember_path: data/ember
  seed: 0
env:
  action_space: exemplar
  n_actions: 16
  max_steps: 60
  step_scale: 4.0
  evade_threshold: 0.5
  reward_evade_bonus: 10.0
  reward_step_penalty: 0.02
  reward_mode: logit
defender:
  name: gbdt
  max_iter: 80
  learning_rate: 0.08
  max_depth: null
  hidden: 128
  epochs: 40
  seed: 0
attacker:
  name: random
  train_episodes: 100
  gamma: 0.95
  lr: 0.001
  hidden: 128
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  buffer_size: 10000
  batch_size: 64
  target_sync: 200
  train_every: 4
  ppo_epochs: 4
  clip: 0.2
  rollout: 512
  device: auto
  seed: 0
retrain:
  cadence: every_round
  every_n: 3
  trigger_threshold: 0.3
  data_selection: full_replay
  buffer_size: 200
  mode: scratch
