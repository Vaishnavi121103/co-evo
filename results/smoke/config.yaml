name: smoke
rounds: 4
convergence_window: 3
convergence_tol: 0.02
early_stop: true
seed: 0
output_dir: results
dataset:
  name: synthetic
  n_features: 16
  n_train: 800
  n_test_malicious: 60
  class_separation: 1.4
  mutable_fraction: 0.6
  ember_path: null
  seed: 0
env:
  action_space: exemplar
  n_actions: 8
  max_steps: 12
  step_scale: 0.3
  evade_threshold: 0.5
  reward_evade_bonus: 10.0
  reward_step_penalty: 0.02
  reward_mode: logit
defender:
  name: gbdt
  max_iter: 60
  learning_rate: 0.1
  max_depth: null
  hidden: 128
  epochs: 40
  seed: 0
attacker:
  name: dqn
  train_episodes: 40
  gamma: 0.95
  lr: 0.001
  hidden: 64
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  buffer_size: 10000
  batch_size: 64
  target_sync: 200
  train_every: 4
  ppo_epochs: 4
  clip: 0.2
  rollout: 512
  device: cpu
  seed: 0
retrain:
  cadence: every_round
  every_n: 3
  trigger_threshold: 0.3
  data_selection: full_replay
  buffer_size: 1000
  mode: scratch
