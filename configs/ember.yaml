# Single showcase co-evolution run on REAL EMBER-2018 (Stage A sanity run).
# Verifies the round-by-round dynamics before committing to the factorial sweep.
name: ember_pilot_v6
rounds: 8
convergence_window: 4
convergence_tol: 0.03
early_stop: false        # equal horizon for every policy
seed: 0
output_dir: results

dataset:
  name: ember
  ember_path: data/ember
  n_train: 8000
  n_test_malicious: 600
  mutable_fraction: 1.0   # attacker controls every realistically-editable feature
  seed: 0

env:
  action_space: exemplar   # per-episode mimicry of a random benign file
  n_actions: 16
  max_steps: 60
  step_scale: 4.0
  evade_threshold: 0.5
  reward_mode: logit
  reward_evade_bonus: 10.0
  reward_step_penalty: 0.02

defender:
  name: gbdt
  max_iter: 80
  learning_rate: 0.08

attacker:
  # Stochastic mimicry over per-episode benign exemplars. Chosen because it
  # applies far stronger and more stable pressure than the RL agents at any
  # feasible budget (0.21 vs DQN 0.018 round-0 attack success); DQN and PPO
  # remain implemented and are compared in docs/methodology_findings.md.
  name: random
  train_episodes: 100
  train_every: 4
  device: auto
  seed: 0

retrain:
  cadence: every_round
  data_selection: full_replay
  # Cap chosen so it BINDS: with ~100-150 evasions found per round, an
  # oversized cap makes full_replay / hard_mining / bounded_buffer collect
  # identical data and the data-selection axis cannot differentiate at all.
  # It also models a real vendor's bounded adversarial-retraining budget.
  buffer_size: 200
  mode: scratch
